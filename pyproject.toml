[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "systemcard"
version = "0.1.0"
description = "A terminal system information card powered by Sysal"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SystemCard contributors" }]
dependencies = ["rich>=13.9"]

[project.scripts]
systemcard = "systemcard.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/systemcard"]

[dependency-groups]
dev = ["pytest>=8.3"]
