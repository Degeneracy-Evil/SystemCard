[build-system]
requires = [
    "scikit-build-core>=0.10; python_version >= '3.8'",
    "pybind11>=2.13; python_version >= '3.8'",
    "pybind11==2.10.4; python_version < '3.8'",
    "setuptools==59.6.0; python_version < '3.8'",
    "wheel==0.37.1; python_version < '3.8'",
    "tomli==1.2.3; python_version < '3.8'",
]
build-backend = "build_backend"
backend-path = ["packaging"]

[project]
name = "systemcard"
version = "0.1.1"
description = "A terminal system information card powered by Sysal"
readme = "README.md"
requires-python = ">=3.6.8"
license = { text = "Apache-2.0" }
authors = [{ name = "SystemCard contributors" }]
dependencies = [
    "rich>=12.6,<13; python_version < '3.8'",
    "rich>=13.9; python_version >= '3.8'",
    "dataclasses==0.8; python_version < '3.7'",
]

[project.scripts]
systemcard = "systemcard.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/systemcard"]
sdist.include = ["packaging/build_backend.py", "setup.py"]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.12" }

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "RUF",
    "S102",
    "S307",
    "S506",
    "S602",
    "S604",
    "S608",
    "SIM",
    "T10",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]
"src/systemcard/*" = ["UP006", "UP007", "UP035", "UP045", "B905"]
"setup.py" = ["UP006", "UP007", "UP035", "UP045"]
"packaging/*" = ["UP006", "UP007", "UP035", "UP036", "UP045"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.cibuildwheel]
build = "cp3{12,13,14}-manylinux_x86_64"
archs = ["x86_64"]
build-frontend = "build[uv]"
test-command = [
    "python -c 'import systemcard._native'",
    "systemcard --version",
    "systemcard --section system --no-color",
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
