name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - name: Verify release version
        id: version
        run: |
          uv run --locked python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from systemcard import __version__

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == __version__, "Package versions disagree"
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/"):
              assert ref == f"refs/tags/v{version}", "Tag does not match package version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - run: uv run --locked python scripts/check.py
      - run: uv run --locked systemcard --section system --no-color
      - name: Verify checks did not modify the repository
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  wheels:
    needs: verify
    uses: ./.github/workflows/wheels.yml

  sdist:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - run: uv build --sdist --out-dir dist
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: systemcard-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: systemcard-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  install:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    env:
      SYSTEMCARD_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install published wheel from PyPI
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip install --index-url https://pypi.org/simple --only-binary=:all: "systemcard==$SYSTEMCARD_VERSION"; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
      - run: python -c 'import systemcard._native'
      - run: systemcard --version
      - run: systemcard --section system --no-color
