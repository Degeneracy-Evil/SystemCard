name: Wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  manylinux:
    name: manylinux2014 x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: Install uv for wheel auditing
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build, repair, audit, and test wheels
        run: python -m cibuildwheel --platform linux --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: systemcard-manylinux2014-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error
