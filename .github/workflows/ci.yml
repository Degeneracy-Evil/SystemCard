name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run quality checks
        run: uv run --locked python scripts/check.py

      - name: Verify quality checks did not modify the repository
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Run smoke test
        run: uv run --locked systemcard --section system --no-color
